name: Build Untis Next Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: untis-next-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable APK
        run: |
          gradle --no-daemon --project-dir android-app assembleDebug
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/UntisNext.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UntisNext-APK
          path: dist/UntisNext.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove previous APK filename
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset android-apk app-debug.apk --yes || true

      - name: Publish latest APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          target_commitish: main
          name: Untis Next – Android APK
          body: |
            Installierbares Android-APK von Untis Next.
            Die App-Version und der Dateiname enthalten keinen Debug-Zusatz.
            Dies ist weiterhin ein Test-Build mit Android-Entwicklungssignatur und kein Play-Store-Release.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/UntisNext.apk
