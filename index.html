<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stundenplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg-a:#0a0c2a; --bg-b:#171154; --bg-c:#2a1264;
    --pink:#ff3ea8; --cyan:#33f0e0; --gold:#ffcc4d; --violet:#8b3bff;
    --card:rgba(255,255,255,0.055); --card-hi:rgba(255,255,255,0.1);
    --line:rgba(255,255,255,0.14);
    --text:#eef0ff; --muted:#9aa1cf;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    font-family:'Inter',sans-serif; color:var(--text);
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(139,59,255,0.35), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(255,62,168,0.25), transparent 60%),
      linear-gradient(160deg,var(--bg-a),var(--bg-b) 55%,var(--bg-c));
    min-height:100vh; padding:24px 16px 60px; position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image:
      radial-gradient(2px 2px at 10% 20%, #fff 100%, transparent),
      radial-gradient(2px 2px at 80% 10%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 60% 70%, #fff 100%, transparent),
      radial-gradient(2px 2px at 30% 85%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 92% 60%, #fff 100%, transparent);
  }
  .wrap{max-width:900px; margin:0 auto; position:relative; z-index:1;}

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .logo{display:flex; flex-direction:column; line-height:.82; transform:skewY(-2deg); flex-shrink:0;}
  .logo-tag{
    font-family:'Baloo 2'; font-weight:700; font-size:9px; letter-spacing:.5px; align-self:flex-start;
    background:linear-gradient(90deg,var(--gold),var(--pink)); color:#2a1264; padding:2px 9px;
    border-radius:6px 6px 0 0; margin-bottom:-2px; transform:skewX(-8deg); text-transform:uppercase;
  }
  .logo-main{display:flex; flex-direction:column;}
  .logo-main span{
    font-family:'Baloo 2'; font-weight:800; font-size:21px; letter-spacing:.5px; transform:skewX(-8deg);
    background:linear-gradient(160deg,var(--gold),var(--pink) 45%,var(--violet) 80%,var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:1.4px rgba(255,255,255,0.9);
    filter:drop-shadow(0 0 8px rgba(255,62,168,.45));
  }
  .logo-main .l2{margin-top:-7px;}
  .loginbtn{
    font-family:'Baloo 2'; font-weight:700; font-size:13px; color:#0a0c2a; cursor:pointer;
    background:linear-gradient(90deg,var(--gold),var(--pink)); border:none; border-radius:999px;
    padding:9px 18px; box-shadow:0 0 14px rgba(255,204,77,.4);
  }

  .weeknav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:10px 14px; margin:18px 0 14px;
  }
  .navbtn{
    width:34px; height:34px; border-radius:10px; border:1px solid var(--line);
    background:rgba(255,255,255,0.06); color:var(--text); font-size:15px; cursor:pointer;
  }
  .navbtn:hover{background:rgba(255,255,255,0.14);}
  .weekcol{text-align:center; flex:1;}
  .weekcol .range{font-family:'Baloo 2'; font-weight:700; font-size:15px;}
  .weekcol .jump{font-size:11px; color:var(--cyan); cursor:pointer; text-decoration:underline;}
  .weekpill{
    font-family:'Baloo 2'; font-weight:700; font-size:12px; padding:6px 14px; border-radius:999px;
    background:linear-gradient(90deg,var(--violet),var(--pink)); box-shadow:0 0 12px rgba(139,59,255,.5);
    white-space:nowrap;
  }

  .tt-wrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--line); background:var(--card);}
  .timetable{display:grid; grid-template-columns:62px repeat(5,minmax(112px,1fr)); min-width:640px;}
  .cell{border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:10px 8px;}
  .timetable .cell:nth-child(6n){border-right:none;}
  .corner{background:var(--bg-b); position:sticky; left:0; z-index:3;}
  .dayhead{background:var(--bg-b); text-align:center;}
  .dayhead .dn{font-family:'Baloo 2'; font-weight:700; font-size:13px;}
  .dayhead .dd{font-size:10px; color:var(--muted);}
  .timecell{
    background:var(--bg-b); position:sticky; left:0; z-index:2;
    font-family:'Baloo 2'; font-weight:700; font-size:11px; color:var(--gold); text-align:center;
  }
  .timecell small{display:block; font-family:'Inter'; font-weight:500; color:var(--muted); font-size:8px;}
  .subjcell{position:relative; cursor:pointer; transition:background .15s;}
  .subjcell:hover{background:var(--card-hi);}
  .subjcell.free{color:var(--muted); cursor:default; font-size:12px;}
  .subjcell .sname{font-family:'Baloo 2'; font-weight:700; font-size:13px; line-height:1.25;}
  .hwdot{
    position:absolute; top:6px; right:6px; min-width:16px; height:16px; padding:0 4px; border-radius:999px;
    background:linear-gradient(90deg,var(--cyan),var(--violet)); color:#0a0c2a; font-size:9px; font-weight:700;
    font-family:'Baloo 2'; display:flex; align-items:center; justify-content:center;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(5,6,20,0.72); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .overlay.show{display:flex;}
  .modal{
    width:100%; max-width:420px; max-height:85vh; overflow-y:auto; border-radius:20px;
    background:linear-gradient(160deg,var(--bg-b),var(--bg-c)); border:1px solid var(--line);
    padding:20px; box-shadow:0 0 40px rgba(139,59,255,.35);
  }
  .modal h2{font-family:'Baloo 2'; font-size:19px; margin:0 0 2px;}
  .modal .msub{font-size:12px; color:var(--muted); margin-bottom:14px;}
  .closebtn{float:right; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; line-height:1;}
  .hwitem{background:rgba(0,0,0,0.22); border-radius:12px; padding:10px 12px; margin-bottom:8px; font-size:14px;}
  .hwitem .who{font-size:11px; color:var(--cyan); font-weight:600; margin-bottom:3px; display:flex; justify-content:space-between; gap:8px;}
  .reportbtn{
    background:none; border:none; color:var(--muted); font-size:11px; cursor:pointer; padding:0;
    font-family:'Inter'; flex-shrink:0;
  }
  .reportbtn:hover{color:var(--pink);}
  .reportbtn:disabled{color:rgba(255,62,168,.6); cursor:default;}
  .hwempty{font-size:13px; color:var(--muted); margin:6px 0 12px;}
  .hwform{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .hwform input, .hwform textarea{
    width:100%; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,0.06);
    color:var(--text); padding:9px 11px; font-family:'Inter'; font-size:14px; resize:vertical;
  }
  .hwform textarea{min-height:60px;}
  .hwform button{
    align-self:flex-end; font-family:'Baloo 2'; font-weight:700; font-size:13px; color:#0a0c2a;
    background:linear-gradient(90deg,var(--gold),var(--pink)); border:none; border-radius:10px;
    padding:9px 18px; cursor:pointer;
  }
  .hwform button:disabled{opacity:.5; cursor:default;}
  .hwerror{font-size:12px; color:var(--pink); margin-top:-2px;}

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:linear-gradient(90deg,var(--violet),var(--pink)); color:#fff; font-family:'Baloo 2';
    font-weight:700; font-size:13px; padding:12px 20px; border-radius:999px; opacity:0;
    transition:opacity .25s, transform .25s; box-shadow:0 0 22px rgba(255,62,168,.5); z-index:60;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .syncbar{text-align:center; font-size:12px; color:var(--muted); margin-top:16px; min-height:16px;}
  .setupbanner{
    background:rgba(255,204,77,0.12); border:1px solid rgba(255,204,77,0.4); border-radius:14px;
    padding:12px 16px; font-size:13px; line-height:1.5; margin-bottom:14px;
  }
  .setupbanner b{color:var(--gold);}
  .setupbanner button{
    margin-top:8px; background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px;
    padding:4px 10px; font-size:12px; cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="logo">
      <div class="logo-tag">Dein Schuljahr</div>
      <div class="logo-main"><span class="l1">STUNDEN</span><span class="l2">PLAN</span></div>
    </div>
    <button class="loginbtn" id="loginBtn">Login</button>
  </div>

  <div id="setupBanner"></div>

  <div class="weeknav">
    <button class="navbtn" id="prevWeek">‹</button>
    <div class="weekcol">
      <div class="range" id="weekRange">–</div>
      <div class="jump" id="jumpToday">Zu dieser Woche springen</div>
    </div>
    <div class="weekpill" id="weekPill">Woche –</div>
    <button class="navbtn" id="nextWeek">›</button>
  </div>

  <div class="tt-wrap"><div class="timetable" id="timetable"></div></div>
  <div class="syncbar" id="syncBar"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   KONFIGURATION — hier trägst du deinen Stundenplan ein.
   ===================================================================== */
const CONFIG = {
  startOfCycleA: "2026-09-21", // ein Montag einer "A"-Woche; Rhythmus wechselt automatisch

  periods: [
    { label: "1.", time: "07:50–08:50" },
    { label: "2.", time: "08:55–09:55" },
    { label: "3.", time: "10:15–11:15" },
    { label: "4.", time: "11:20–12:20" },
    { label: "5.", time: "13:00–14:00" },
    { label: "6.", time: "14:05–15:05" },
  ],

  schedule: {
    A: {
      Montag:     ["Deutsch", "Geschichte",  "Erdkunde",      "Latein",  "",     ""],
      Dienstag:   ["Wahlpflicht",     "Kunst",   "Physik",    "Mathe",  "",     ""],
      Mittwoch:   ["Religion/PPL",   "Sport","Chemie",  "Englisch","",          ""],
      Donnerstag: ["Mathe",    "Deutsch",   "Latein",     "Biologie",     "",  ""],
      Freitag:    ["Wahlpflicht", "Englisch", "Chemie", "Politik",     "",          ""],
    },
    B: {
      Montag:     ["Deutsch",   "Geschichte","Erdkunde",     "Latein",   "",     ""],
      Dienstag:   ["Wahlpflicht",    "Kunst", "Physik",     "Mathe",    "",          ""],
      Mittwoch:   ["Religion/PPL",   "Sport","Mathe","Englisch",  "",          ""],
      Donnerstag: ["Mathe",      "Deutsch", "Latein",    "Biologie",    "",    ""],
      Freitag:    ["Wahlpflicht", "Englisch",    "Chemie", "Politik",  "",          ""],
    },
  },

  // Für ECHT geteilte Hausaufgaben (alle sehen dieselben Einträge), per Firebase Firestore:
  // 1) Kostenloses Google-Konto → https://console.firebase.google.com → "Projekt hinzufügen"
  // 2) Im Projekt links "Build" → "Firestore Database" → "Datenbank erstellen" (production mode)
  // 3) Zahnrad oben links → "Projekteinstellungen" → runterscrollen zu "Meine Apps" → </> (Web-App) → registrieren
  // 4) Das dort angezeigte firebaseConfig-Objekt hier eintragen:
  const firebaseConfig = {
  apiKey: "AIzaSyBgkWUtFIH63yJUw4zTbNtplKL5HqDDXMg",

  authDomain: "next-untis-plus.firebaseapp.com",

  databaseURL: "https://next-untis-plus-default-rtdb.europe-west1.firebasedatabase.app",

  projectId: "next-untis-plus",

  storageBucket: "next-untis-plus.firebasestorage.app",

  messagingSenderId: "276114359651",

  appId: "1:276114359651:web:c357fa4cc4f395bf55bf56",

  measurementId: "G-VD8CKYNT8C"

  },
};
/* ===================================================================== */

const DAY_NAMES = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"];
const DAY_SHORT = ["Mo","Di","Mi","Do","Fr"];
const SHARED_MODE = CONFIG.firebase.apiKey !== "DEIN_API_KEY" && CONFIG.firebase.projectId !== "DEIN_PROJEKT";
let db = null;
if(SHARED_MODE){
  firebase.initializeApp(CONFIG.firebase);
  db = firebase.firestore();
}
const LOCAL_KEY = "stundenplan_homework_local";
// kleine Liste offensichtlicher Platzhalter/Spam-Wörter, keine Schimpfwortliste
const JUNK_WORDS = ["asdf","asdfasdf","test123","lorem ipsum","quatsch","xxxxx","keine ahnung lol","idk"];

let selectedMonday = mondayOf(new Date());
let homeworkData = {};

function pad(n){ return n.toString().padStart(2,"0"); }
function isoDate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function mondayOf(d){ const date=new Date(d); date.setHours(0,0,0,0); const diff=(date.getDay()+6)%7; date.setDate(date.getDate()-diff); return date; }
function addDays(d,n){ const c=new Date(d); c.setDate(c.getDate()+n); return c; }
function weekType(monday){
  const ref = mondayOf(new Date(CONFIG.startOfCycleA));
  const weeks = Math.round((monday-ref)/(7*86400000));
  return (((weeks%2)+2)%2===0) ? "A" : "B";
}
function fmtShort(d){ return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.`; }
function fmtLong(d){ return d.toLocaleDateString("de-DE",{day:"2-digit",month:"long",year:"numeric"}); }

/* ---- Unsinn-Filter: erkennt offensichtlichen Spam/Kauderwelsch ---- */
function isNonsense(text){
  const t = text.trim();
  if(t.length < 3) return true;
  if(JUNK_WORDS.includes(t.toLowerCase())) return true;
  if(/(.)\1{4,}/.test(t)) return true; // z.B. "aaaaaa"
  const letters = t.toLowerCase().replace(/[^a-zäöüß]/g,"");
  const compact = t.replace(/\s/g,"");
  if(letters.length >= 6){
    const vowels = (letters.match(/[aeiouäöü]/g)||[]).length;
    if(vowels/letters.length < 0.12) return true; // kaum Vokale = Tastatur-Gemasche
  }
  if(compact.length >= 6 && letters.length/compact.length < 0.4) return true; // fast nur Symbole/Zahlen
  return false;
}

/* ---- Datenspeicher: Firebase Firestore, sonst lokal im Browser ---- */
async function loadHomework(){
  if(!SHARED_MODE){
    try{ homeworkData = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"); }catch(e){ homeworkData = {}; }
    setSync("Nur lokal gespeichert (nur du siehst das)");
    return;
  }
  setSync("Verbinde…");
  try{
    const snap = await db.collection("homework").get();
    homeworkData = {};
    snap.forEach(doc => { homeworkData[doc.id] = (doc.data().entries) || []; });
    setSync("Synchronisiert · für alle sichtbar (Firebase)");
  }catch(e){
    console.error(e); homeworkData = {};
    setSync("⚠️ Verbindung fehlgeschlagen — Firebase-Einrichtung prüfen");
  }
}
async function saveHomework(hwKey){
  if(!SHARED_MODE){ localStorage.setItem(LOCAL_KEY, JSON.stringify(homeworkData)); return true; }
  setSync("Speichert…");
  try{
    await db.collection("homework").doc(hwKey).set({ entries: homeworkData[hwKey] || [] });
    setSync("Synchronisiert · für alle sichtbar (Firebase)");
    return true;
  }catch(e){ console.error(e); setSync("⚠️ Speichern fehlgeschlagen — bitte erneut versuchen"); return false; }
}
function setSync(msg){ document.getElementById("syncBar").textContent = msg; }

function renderSetupBanner(){
  const el = document.getElementById("setupBanner");
  if(SHARED_MODE || localStorage.getItem("hideSetupBanner")){ el.innerHTML=""; return; }
  el.innerHTML = `<div class="setupbanner">
    <b>Hinweis:</b> Hausaufgaben sind aktuell nur lokal in deinem Browser gespeichert.
    Damit alle dieselben Hausaufgaben sehen, trage bei <b>CONFIG.firebase</b> im Code
    dein kostenloses <b>Firebase</b>-Projekt ein.
    <button id="hideBanner">Ausblenden</button>
  </div>`;
  document.getElementById("hideBanner").onclick = ()=>{ localStorage.setItem("hideSetupBanner","1"); renderSetupBanner(); };
}

function renderWeekNav(){
  const friday = addDays(selectedMonday,4);
  document.getElementById("weekRange").textContent = `${fmtShort(selectedMonday)} – ${fmtShort(friday)}`;
  document.getElementById("weekPill").textContent = "Woche " + weekType(selectedMonday);
}

function renderTimetable(){
  const wt = weekType(selectedMonday);
  const dates = DAY_NAMES.map((_,i)=>addDays(selectedMonday,i));
  const tt = document.getElementById("timetable");
  tt.innerHTML = "";

  tt.appendChild(el("div","cell corner"));
  DAY_NAMES.forEach((dn,i)=>{
    const c = el("div","cell dayhead");
    c.innerHTML = `<div class="dn">${DAY_SHORT[i]}</div><div class="dd">${fmtShort(dates[i])}</div>`;
    tt.appendChild(c);
  });

  CONFIG.periods.forEach((p, pIdx)=>{
    const tc = el("div","cell timecell");
    tc.innerHTML = `${p.label}<small>${p.time}</small>`;
    tt.appendChild(tc);

    DAY_NAMES.forEach((dn,i)=>{
      const subject = ((CONFIG.schedule[wt][dn]||[])[pIdx] || "").trim();
      const isFree = subject==="" || subject==="-";
      const dateKey = isoDate(dates[i]);
      const hwKey = `${dateKey}_${pIdx}`;
      const entries = homeworkData[hwKey] || [];
      const c = el("div","cell subjcell" + (isFree?" free":""));
      c.innerHTML = isFree ? "–" : `<div class="sname">${subject}</div>${entries.length?`<div class="hwdot">${entries.length}</div>`:""}`;
      if(!isFree){
        c.addEventListener("click", ()=> openModal(dates[i], pIdx, subject));
      }
      tt.appendChild(c);
    });
  });
}
function el(tag, cls){ const e=document.createElement(tag); e.className=cls; return e; }

function openModal(date, pIdx, subject){
  const dateKey = isoDate(date);
  const hwKey = `${dateKey}_${pIdx}`;
  const p = CONFIG.periods[pIdx];
  const overlay = document.getElementById("overlay");
  const modal = document.getElementById("modal");

  function draw(){
    const entries = homeworkData[hwKey] || [];
    modal.innerHTML = `
      <button class="closebtn" id="closeModal">×</button>
      <h2>${subject}</h2>
      <div class="msub">${fmtLong(date)} · ${p.label} Stunde (${p.time})</div>
      <div class="hwlist"></div>
      <div class="hwform">
        <input type="text" class="hwauthor" placeholder="Dein Name (optional)">
        <textarea class="hwtext" placeholder="Hausaufgabe eintragen…"></textarea>
        <div class="hwerror" id="hwerror"></div>
        <button class="hwsave">Speichern</button>
      </div>
    `;
    const list = modal.querySelector(".hwlist");
    if(entries.length===0){
      list.innerHTML = `<div class="hwempty">Noch keine Hausaufgaben für diesen Tag.</div>`;
    }else{
      entries.forEach((e,idx)=>{
        if(!e.id) e.id = `${hwKey}_${e.ts||idx}`;
        const alreadyReported = wasReported(e.id);
        const item = el("div","hwitem");
        item.innerHTML = `<div class="who"><span>${e.author?e.author:"Anonym"}</span>
          <button class="reportbtn" ${alreadyReported?"disabled":""}>🚩 ${alreadyReported?"Gemeldet":"Melden"}${e.reports?` (${e.reports})`:""}</button>
        </div>${escapeHtml(e.text)}`;
        item.querySelector(".reportbtn").onclick = ()=> reportEntry(hwKey, e.id, draw);
        list.appendChild(item);
      });
    }
    modal.querySelector("#closeModal").onclick = closeModal;
    const saveBtn = modal.querySelector(".hwsave");
    saveBtn.onclick = async ()=>{
      const textEl = modal.querySelector(".hwtext");
      const authorEl = modal.querySelector(".hwauthor");
      const errEl = modal.querySelector("#hwerror");
      const text = textEl.value.trim();
      errEl.textContent = "";
      if(!text) return;
      if(isNonsense(text)){
        errEl.textContent = "Das sieht nach Unsinn/Spam aus — bitte eine echte Hausaufgabe eintragen.";
        return;
      }
      saveBtn.disabled = true; saveBtn.textContent = "Speichert…";
      if(!homeworkData[hwKey]) homeworkData[hwKey] = [];
      homeworkData[hwKey].push({ id:genId(), text, author:authorEl.value.trim(), ts:Date.now(), reports:0 });
      const ok = await saveHomework(hwKey);
      saveBtn.disabled = false; saveBtn.textContent = "Speichern";
      if(ok){ draw(); renderTimetable(); }
    };
  }
  draw();
  overlay.classList.add("show");
}
function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function wasReported(id){
  try{ return JSON.parse(localStorage.getItem("reportedHw")||"[]").includes(id); }catch(e){ return false; }
}
function markReported(id){
  try{
    const list = JSON.parse(localStorage.getItem("reportedHw")||"[]");
    list.push(id);
    localStorage.setItem("reportedHw", JSON.stringify(list));
  }catch(e){}
}
const REPORT_THRESHOLD = 2; // ab so vielen Meldungen wird ein Eintrag automatisch entfernt
async function reportEntry(hwKey, id, redraw){
  if(wasReported(id)) return;
  const list = homeworkData[hwKey] || [];
  const entry = list.find(e=>e.id===id);
  if(!entry) return;
  entry.reports = (entry.reports||0) + 1;
  markReported(id);
  if(entry.reports >= REPORT_THRESHOLD){
    homeworkData[hwKey] = list.filter(e=>e.id!==id);
    await saveHomework(hwKey);
    showToast("🚩 Eintrag wurde mehrfach gemeldet und entfernt");
    renderTimetable();
    closeModal();
    return;
  }
  await saveHomework(hwKey);
  showToast("Danke fürs Melden!");
  redraw();
  renderTimetable();
}

function closeModal(){ document.getElementById("overlay").classList.remove("show"); }
document.getElementById("overlay").addEventListener("click",(e)=>{ if(e.target.id==="overlay") closeModal(); });

function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let toastTimer;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 2600);
}
document.getElementById("loginBtn").onclick = ()=> showToast("🔒 Login — Coming Soon");

document.getElementById("prevWeek").onclick = ()=>{ selectedMonday = addDays(selectedMonday,-7); renderAll(); };
document.getElementById("nextWeek").onclick = ()=>{ selectedMonday = addDays(selectedMonday,7); renderAll(); };
document.getElementById("jumpToday").onclick = ()=>{ selectedMonday = mondayOf(new Date()); renderAll(); };

function renderAll(){ renderWeekNav(); renderTimetable(); }

(async function init(){
  renderSetupBanner();
  await loadHomework();
  renderAll();
})();
</script>
</body>
