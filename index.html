<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stundenplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --bg-a:#0a0c2a; --bg-b:#171154; --bg-c:#2a1264;
    --pink:#ff3ea8; --cyan:#33f0e0; --gold:#ffcc4d; --violet:#8b3bff;
    --card:rgba(255,255,255,0.055); --card-hi:rgba(255,255,255,0.1);
    --line:rgba(255,255,255,0.14);
    --text:#eef0ff; --muted:#9aa1cf;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    font-family:'Inter',sans-serif; color:var(--text);
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(139,59,255,0.35), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(255,62,168,0.25), transparent 60%),
      linear-gradient(160deg,var(--bg-a),var(--bg-b) 55%,var(--bg-c));
    min-height:100vh; padding:24px 16px 60px; position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image:
      radial-gradient(2px 2px at 10% 20%, #fff 100%, transparent),
      radial-gradient(2px 2px at 80% 10%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 60% 70%, #fff 100%, transparent),
      radial-gradient(2px 2px at 30% 85%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 92% 60%, #fff 100%, transparent);
  }
  .wrap{max-width:900px; margin:0 auto; position:relative; z-index:1;}

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .logo{display:flex; flex-direction:column; line-height:.82; transform:skewY(-2deg); flex-shrink:0;}
  .logo-tag{
    font-family:'Baloo 2'; font-weight:700; font-size:9px; letter-spacing:.5px; align-self:flex-start;
    background:linear-gradient(90deg,var(--gold),var(--pink)); color:#2a1264; padding:2px 9px;
    border-radius:6px 6px 0 0; margin-bottom:-2px; transform:skewX(-8deg); text-transform:uppercase;
  }
  .logo-main{display:flex; flex-direction:column;}
  .logo-main span{
    font-family:'Baloo 2'; font-weight:800; font-size:21px; letter-spacing:.5px; transform:skewX(-8deg);
    background:linear-gradient(160deg,var(--gold),var(--pink) 45%,var(--violet) 80%,var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:1.4px rgba(255,255,255,0.9);
    filter:drop-shadow(0 0 8px rgba(255,62,168,.45));
  }
  .logo-main .l2{margin-top:-7px;}
  .loginbtn{
    font-family:'Baloo 2'; font-weight:700; font-size:13px; color:#0a0c2a; cursor:pointer;
    background:linear-gradient(90deg,var(--gold),var(--pink)); border:none; border-radius:999px;
    padding:9px 18px; box-shadow:0 0 14px rgba(255,204,77,.4);
  }
  .themebtn{
    border:1px solid rgba(51,240,224,.45); color:var(--cyan); background:rgba(51,240,224,.08);
    border-radius:999px; padding:8px 12px; font:700 12px 'Baloo 2'; cursor:pointer;
  }
  .themebtn:hover{background:rgba(51,240,224,.16);}

  .weeknav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:10px 14px; margin:18px 0 14px;
  }
  .navbtn{
    width:34px; height:34px; border-radius:10px; border:1px solid var(--line);
    background:rgba(255,255,255,0.06); color:var(--text); font-size:15px; cursor:pointer;
  }
  .navbtn:hover{background:rgba(255,255,255,0.14);}
  .weekcol{text-align:center; flex:1;}
  .weekcol .range{font-family:'Baloo 2'; font-weight:700; font-size:15px;}
  .weekcol .jump{font-size:11px; color:var(--cyan); cursor:pointer; text-decoration:underline;}
  .weekpill{
    font-family:'Baloo 2'; font-weight:700; font-size:12px; padding:6px 14px; border-radius:999px;
    background:linear-gradient(90deg,var(--violet),var(--pink)); box-shadow:0 0 12px rgba(139,59,255,.5);
    white-space:nowrap;
  }

  .tt-wrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--line); background:var(--card);}
  .timetable{display:grid; grid-template-columns:62px repeat(5,minmax(112px,1fr)); min-width:640px;}
  .cell{border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:10px 8px;}
  .timetable .cell:nth-child(6n){border-right:none;}
  .corner{background:var(--bg-b); position:sticky; left:0; z-index:3;}
  .dayhead{background:var(--bg-b); text-align:center;}
  .dayhead .dn{font-family:'Baloo 2'; font-weight:700; font-size:13px;}
  .dayhead .dd{font-size:10px; color:var(--muted);}
  .timecell{
    background:var(--bg-b); position:sticky; left:0; z-index:2;
    font-family:'Baloo 2'; font-weight:700; font-size:11px; color:var(--gold); text-align:center;
  }
  .timecell small{display:block; font-family:'Inter'; font-weight:500; color:var(--muted); font-size:8px;}
  .subjcell{position:relative; cursor:pointer; transition:background .15s;}
  .subjcell:hover{background:var(--card-hi);}
  .subjcell.free{color:var(--muted); cursor:default; font-size:12px;}
  .subjcell .sname{font-family:'Baloo 2'; font-weight:700; font-size:13px; line-height:1.25;}
  .hwdot{
    position:absolute; bottom:6px; right:6px; min-width:16px; height:16px; padding:0 4px; border-radius:999px;
    background:linear-gradient(90deg,var(--cyan),var(--violet)); color:#0a0c2a; font-size:9px; font-weight:700;
    font-family:'Baloo 2'; display:flex; align-items:center; justify-content:center;
  }
  .subjcell.classwork .sname{color:var(--gold); text-shadow:0 0 10px rgba(255,204,77,.42);}
  .subjcell.classwork{box-shadow:inset 0 0 22px rgba(255,204,77,.08);}
  .subjcell .sname{padding-right:30px;}
  .classwork-btn{
    position:absolute; top:5px; right:5px; z-index:2; border:1px solid rgba(255,204,77,.55);
    background:rgba(255,204,77,.08); color:var(--gold); border-radius:7px; width:28px; height:20px;
    padding:0; font:700 9px 'Baloo 2'; cursor:pointer; line-height:18px;
  }
  .classwork-btn:hover{background:rgba(255,204,77,.2);}
  .classwork-section{background:rgba(255,204,77,.07);border:1px solid rgba(255,204,77,.24);border-radius:12px;padding:10px 12px;margin-bottom:12px;}
  .classwork-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;}
  .classwork-section h3{font-family:'Baloo 2';font-size:14px;color:var(--gold);margin:0;}
  .classwork-save{flex:0 0 auto;width:24px;height:18px;padding:0;border:1px solid rgba(255,204,77,.55);
    background:rgba(255,204,77,.08);color:var(--gold);border-radius:6px;font:700 8px 'Baloo 2';cursor:pointer;line-height:16px;}
  .classwork-save:hover{background:rgba(255,204,77,.2);}
  .classwork-item{font-size:13px;padding:8px 0;border-top:1px solid rgba(255,255,255,.08);}
  .classwork-item:first-child{border-top:0;padding-top:0;}
  .classwork-meta{font-size:10px;color:var(--muted);margin-top:3px;}
  .classwork-add{display:flex;gap:7px;margin-top:8px;}
  .classwork-add input{flex:1;min-width:0;}
  .image-picker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .image-picker input{padding:7px;}
  .image-list{display:flex;gap:7px;flex-wrap:wrap;}
  .image-chip{font-size:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:5px 8px;color:var(--muted);}
  .image-gallery{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .image-gallery a{display:block;width:110px;height:82px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:rgba(0,0,0,.2);}
  .image-gallery img{width:100%;height:100%;object-fit:cover;display:block;}
  .image-status{font-size:11px;color:var(--muted);margin-top:5px;}

  .overlay{
    position:fixed; inset:0; background:rgba(5,6,20,0.72); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .overlay.show{display:flex;}
  body.maintenance-pending .wrap{visibility:hidden;}
  .maintenance-overlay{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    z-index:100; padding:24px; background:rgba(5,6,20,.86); backdrop-filter:blur(8px);
  }
  .maintenance-overlay.show{display:flex;pointer-events:auto;}
  .maintenance-card{
    width:100%; max-width:560px; text-align:center; border-radius:24px; padding:30px 24px;
    background:linear-gradient(160deg,var(--bg-b),var(--bg-c)); border:1px solid var(--line);
    box-shadow:0 0 50px rgba(139,59,255,.35);
  }
  .maintenance-card .icon{font-size:42px; margin-bottom:10px;}
  .maintenance-card h2{font-family:'Baloo 2'; font-size:26px; margin:0 0 6px;}
  .maintenance-card p{color:var(--muted); font-size:14px; line-height:1.6; margin:8px 0 0; white-space:pre-wrap;}
  .modal{
    width:100%; max-width:420px; max-height:85vh; overflow-y:auto; border-radius:20px;
    background:linear-gradient(160deg,var(--bg-b),var(--bg-c)); border:1px solid var(--line);
    padding:20px; box-shadow:0 0 40px rgba(139,59,255,.35);
  }
  .modal h2{font-family:'Baloo 2'; font-size:19px; margin:0 0 2px;}
  .modal .msub{font-size:12px; color:var(--muted); margin-bottom:14px;}
  .closebtn{float:right; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; line-height:1;}
  .hwitem{background:rgba(0,0,0,0.22); border-radius:12px; padding:10px 12px; margin-bottom:8px; font-size:14px;}
  .hwitem .who{font-size:11px; color:var(--cyan); font-weight:600; margin-bottom:3px; display:flex; justify-content:space-between; gap:8px;}
  .reportbtn{
    background:none; border:none; color:var(--muted); font-size:11px; cursor:pointer; padding:0;
    font-family:'Inter'; flex-shrink:0;
  }
  .reportbtn:hover{color:var(--pink);}
  .reportbtn:disabled{color:rgba(255,62,168,.6); cursor:default;}
  .hwempty{font-size:13px; color:var(--muted); margin:6px 0 12px;}
  .hwform{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .hwform input, .hwform textarea{
    width:100%; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,0.06);
    color:var(--text); padding:9px 11px; font-family:'Inter'; font-size:14px; resize:vertical;
  }
  .hwform textarea{min-height:60px;}
  .hwform button{
    align-self:flex-end; font-family:'Baloo 2'; font-weight:700; font-size:13px; color:#0a0c2a;
    background:linear-gradient(90deg,var(--gold),var(--pink)); border:none; border-radius:10px;
    padding:9px 18px; cursor:pointer;
  }
  .hwform button:disabled{opacity:.5; cursor:default;}
  .hwerror{font-size:12px; color:var(--pink); margin-top:-2px;}

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:linear-gradient(90deg,var(--violet),var(--pink)); color:#fff; font-family:'Baloo 2';
    font-weight:700; font-size:13px; padding:12px 20px; border-radius:999px; opacity:0;
    transition:opacity .25s, transform .25s; box-shadow:0 0 22px rgba(255,62,168,.5); z-index:60;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .syncbar{text-align:center; font-size:12px; color:var(--muted); margin-top:16px; min-height:16px;}
  .setupbanner{
    background:rgba(255,204,77,0.12); border:1px solid rgba(255,204,77,0.4); border-radius:14px;
    padding:12px 16px; font-size:13px; line-height:1.5; margin-bottom:14px;
  }
  .setupbanner b{color:var(--gold);}
  .setupbanner button{
    margin-top:8px; background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px;
    padding:4px 10px; font-size:12px; cursor:pointer;
  }

  /* Wartungsbypass und Themes */
  .maintenance-bypass-btn{margin-top:18px;max-width:100%;white-space:normal}
  .maintenance-bypass-btn[hidden],.maintenance-bypass-help[hidden]{display:none!important}
  .maintenance-bypass-help{font-size:11px!important;opacity:.85;margin-top:10px!important}
  .theme-balance{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 13px;margin:12px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:12px}
  .theme-balance strong{color:var(--gold);font-family:'Baloo 2';font-size:15px}
  .theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
  .theme-card{min-width:0;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);display:grid;gap:9px}
  .theme-preview{height:58px;border-radius:9px;border:1px solid #ffffff25;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--preview-a),var(--preview-b),var(--preview-c))}
  .theme-preview:before{content:"";position:absolute;width:95px;height:95px;right:-20px;top:-46px;border:1px solid #ffffffa0;border-radius:50%;box-shadow:0 0 0 11px #ffffff14,0 0 0 23px #ffffff0c}
  .theme-preview:after{content:"";position:absolute;width:125px;height:50px;left:16px;bottom:-31px;border:4px solid #ffffffa0;border-radius:50%;transform:rotate(-18deg)}
  .theme-card-title{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .theme-card-title strong{font-family:'Baloo 2';font-size:14px}
  .theme-card-title small{display:block;color:var(--muted);font-size:10px;line-height:1.45;margin-top:2px}
  .theme-owned-pill{flex:0 0 auto;color:var(--cyan);font-size:9px;font-weight:800}
  .theme-action{width:100%;min-height:34px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.06);color:var(--text);font:700 11px 'Baloo 2';cursor:pointer;padding:7px 9px}
  .theme-action.primary{background:linear-gradient(90deg,var(--gold),var(--pink));color:#160d38;border:0}
  .theme-action:disabled{opacity:.7;cursor:default}
  .theme-card .classwork-meta{min-height:28px;line-height:1.45}
  .theme-login-note{font-size:11px;color:var(--muted);line-height:1.6;margin:12px 0 0}
  body{background:
    radial-gradient(1200px 700px at 85% -10%,color-mix(in srgb,var(--violet) 34%,transparent),transparent 60%),
    radial-gradient(900px 600px at -10% 110%,color-mix(in srgb,var(--pink) 24%,transparent),transparent 60%),
    linear-gradient(160deg,var(--bg-a),var(--bg-b) 55%,var(--bg-c));}
  .themebtn{border-color:color-mix(in srgb,var(--cyan) 45%,transparent);color:var(--cyan);background:color-mix(in srgb,var(--cyan) 9%,transparent)}
  @media(max-width:520px){.theme-grid{grid-template-columns:1fr}.theme-preview{height:50px}.maintenance-bypass-btn{width:100%}}

</style>
</head>

function pad(n){ return n.toString().padStart(2,"0"); }
function isoDate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function mondayOf(d){ const date=new Date(d); date.setHours(0,0,0,0); const diff=(date.getDay()+6)%7; date.setDate(date.getDate()-diff); return date; }
function addDays(d,n){ const c=new Date(d); c.setDate(c.getDate()+n); return c; }
function weekType(monday){
  const ref = mondayOf(new Date(CONFIG.startOfCycleA));
  const weeks = Math.round((monday-ref)/(7*86400000));
  return (((weeks%2)+2)%2===0) ? "A" : "B";
}
function fmtShort(d){ return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.`; }
function fmtLong(d){ return d.toLocaleDateString("de-DE",{day:"2-digit",month:"long",year:"numeric"}); }

/* ---- Unsinn-Filter: erkennt offensichtlichen Spam/Kauderwelsch ---- */
// kleine Liste offensichtlicher Platzhalter/Spam-Wörter, keine Schimpfwortliste
const JUNK_WORDS = ["asdf","asdfasdf","test123","lorem ipsum","quatsch","xxxxx","keine ahnung lol","idk"];

function isNonsense(text){
  const t = text.trim();
  if(t.length < 3) return true;
  if(JUNK_WORDS.includes(t.toLowerCase())) return true;
  if(/(.)\1{4,}/.test(t)) return true; // z.B. "aaaaaa"
  const letters = t.toLowerCase().replace(/[^a-zäöüß]/g,"");
  const compact = t.replace(/\s/g,"");
  if(letters.length >= 6){
    const vowels = (letters.match(/[aeiouäöü]/g)||[]).length;
    if(vowels/letters.length < 0.12) return true; // kaum Vokale = Tastatur-Gemasche
  }
  if(compact.length >= 6 && letters.length/compact.length < 0.4) return true; // fast nur Symbole/Zahlen
  return false;
}

function rebuildHomeworkData(){
  const merged={};
  const keys=new Set([...Object.keys(sharedHomeworkData),...Object.keys(olderSharedHomeworkData),...Object.keys(legacyHomeworkData)]);
  keys.forEach(key=>{
    const active=Array.isArray(sharedHomeworkData[key])?sharedHomeworkData[key]:[];
    const older=Array.isArray(olderSharedHomeworkData[key])?olderSharedHomeworkData[key]:[];
    const legacy=Array.isArray(legacyHomeworkData[key])?legacyHomeworkData[key]:[];
    const seen=new Set();
    merged[key]=[...active,...older,...legacy].filter(entry=>{
      if(!entry?.id || seen.has(entry.id)) return false;
      seen.add(entry.id);
      return true;
    });
  });
  homeworkData=merged;
}

function getHomeworkEntries(hwKey){
  const active=Array.isArray(sharedHomeworkData[hwKey])?sharedHomeworkData[hwKey]:[];
  const older=Array.isArray(olderSharedHomeworkData[hwKey])?olderSharedHomeworkData[hwKey]:[];
  const legacy=Array.isArray(legacyHomeworkData[hwKey])?legacyHomeworkData[hwKey]:[];
  return [...active,...older,...legacy];
}

function refreshMaintenanceAccess(forceReload=false){
  const blocked=maintenanceEnabled && !hasActiveMaintenanceBypass();
  const changed=blocked!==maintenanceBlocked;
  maintenanceBlocked=blocked;
  const overlay=document.getElementById("maintenanceOverlay");
  if(overlay) overlay.classList.toggle("show",blocked);
  renderMaintenanceBypassButton();
  if(changed || forceReload){
    if(blocked){
      resetHomeworkListeners();
      sharedHomeworkData={};
      olderSharedHomeworkData={};
      legacyHomeworkData={};
      homeworkData={};
      renderAll();
    }else{
      reloadWeekData();
    }
  }
}
function applyMaintenanceState(enabled,message,forceReload=false){
  maintenanceEnabled=enabled;
  const messageEl=document.getElementById("maintenanceMessage");
  if(messageEl) messageEl.textContent=message || "JDNEXT ist momentan vorübergehend nicht verfügbar.";
  document.body.classList.remove("maintenance-pending");
  refreshMaintenanceAccess(forceReload);
}
function startMaintenanceListener(){
  tobiDb.collection("siteSettings").doc("jdnext").onSnapshot(
    snap=>{
      const data=snap.exists ? (snap.data()||{}) : {};
      const enabled=data.enabled===true;
      const message=typeof data.message==="string" ? data.message.trim() : "";
      const firstLoad=!maintenanceInitialized;
      maintenanceInitialized=true;
      applyMaintenanceState(enabled,message,firstLoad);
    },
    err=>{
      console.warn("Maintenance-Status konnte nicht geladen werden:",err);
      if(!maintenanceInitialized){
        maintenanceInitialized=true;
        applyMaintenanceState(false,"",true);
      }
    }
  );
}

function currentWeekHomeworkKeys(){
  const dates=DAY_NAMES.map((_,i)=>addDays(selectedMonday,i));
  const keys=[];
  for(let pIdx=0;pIdx<CONFIG.periods.length;pIdx++){
    for(let i=0;i<dates.length;i++){
      const subject=((CONFIG.schedule[weekType(selectedMonday)][DAY_NAMES[i]]||[])[pIdx]||"").trim();
      if(subject && subject!=="-") keys.push(isoDate(dates[i])+"_"+pIdx);
    }
  }
  return keys;
}

async function ensureTobiProfile(user){
  if(!user || user.isAnonymous) return null;
  const ref=tobiDb.collection("users").doc(user.uid);
  let snap=await ref.get();
  if(!snap.exists){
    await ref.set({
      email:user.email||"",
      displayName:user.displayName||"",
      tags:[],
      goldCoins:0,
      authProvider:"firebase-auth",
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      lastProfileChangeAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    snap=await ref.get();
  }
  if(!snap.exists) throw new Error("TobiServices-Profil konnte nicht erstellt werden.");
  let data=snap.data()||{};
  if(!Object.prototype.hasOwnProperty.call(data,"goldCoins")){
    try{
      await ref.update({goldCoins:0});
      snap=await ref.get();
      data=snap.data()||{};
    }catch(error){
      console.warn("Goldmünzenfeld konnte nicht initialisiert werden:",error);
    }
  }
  return data;
}

async function resolveDiscordImage(ref){
  const key=String(ref?.messageId||"")+":"+String(ref?.attachmentId||"");
  if(discordUrlCache.has(key)) return discordUrlCache.get(key);
  try{
    const result=await resolveDiscordImageCall({
      messageId:String(ref?.messageId||""),
      attachmentId:String(ref?.attachmentId||"")
    });
    const url=result.data?.url;
    if(typeof url==="string" && url.startsWith("https://cdn.discordapp.com/")){
      discordUrlCache.set(key,url);
      return url;
    }
  }catch(error){
    console.warn("Discord-CDN-URL konnte nicht erneuert werden:",error);
  }
  return null;
}

async function resolveHomeworkImage(ref,hwKey,entryId){
  if(ref?.kind==="firestore" && typeof ref.imageId==="string"){
    try{
      const snapshot=await tobiDb.collection("jdnextHomework").doc(hwKey)
        .collection("entries").doc(entryId).collection("images").doc(ref.imageId).get();
      const dataUrl=snapshot.exists?snapshot.data()?.dataUrl:null;
      if(typeof dataUrl==="string" && dataUrl.startsWith("data:image/jpeg;base64,")
         && dataUrl.length<=800000) return dataUrl;
    }catch(error){
      console.warn("Firestore-Bild konnte nicht geladen werden:",error);
    }
    return null;
  }
  // Older entries can still contain Discord attachment references.
  return resolveDiscordImage(ref);
}

function renderDiscordGallery(container,images,hwKey,entryId){
  if(!Array.isArray(images)||!images.length)return;
  const gallery=el("div","image-gallery");
  container.appendChild(gallery);
  images.forEach(async ref=>{
    const url=await resolveHomeworkImage(ref,hwKey,entryId);
    if(!url){
      const failed=el("div","image-status");
      failed.textContent="Bild momentan nicht verfügbar.";
      gallery.appendChild(failed);
      return;
    }
    const link=document.createElement("a");
    link.href=url;
    link.target="_blank";
    link.rel="noopener noreferrer";
    const img=document.createElement("img");
    img.loading="lazy";
    img.alt=String(ref.filename||"Hausaufgabenbild");
    img.src=url;
    link.appendChild(img);
    gallery.appendChild(link);
  });
}

async function loadHomework(){
  homeworkUnsubscribes.forEach(unsub=>{ try{unsub();}catch{} });
  homeworkUnsubscribes=[];
  const keys=currentWeekHomeworkKeys();
  if(!keys.length){
    setSync("● Keine Hausaufgaben-Slots in dieser Woche");
    return;
  }
  setSync("Lade Hausaufgaben…");
  let remaining=keys.length*2;
  let finished=false;
  return new Promise(resolve=>{
    const done=()=>{
      remaining--;
      if(!finished && remaining<=0){
        finished=true;
        setSync("● Live synchronisiert · Hausaufgaben öffentlich lesbar");
        resolve();
      }
    };
    keys.forEach(hwKey=>{
      const unsub=tobiDb.collection("jdnextHomework").doc(hwKey).collection("entries").onSnapshot(
        snap=>{
          sharedHomeworkData[hwKey]=[];
          snap.forEach(d=>{
            const data=d.data()||{};
            sharedHomeworkData[hwKey].push({
              id:d.id,
              text:typeof data.text==="string"?data.text:"",
              author:typeof data.author==="string"?data.author:"",
              authorUid:"",
              reportCount:Number.isSafeInteger(data.reportCount)?data.reportCount:0,
              createdAt:data.createdAt||null,
              images:Array.isArray(data.images)?data.images:[],
              legacy:false
            });
          });
          rebuildHomeworkData();
          renderTimetable();
          done();
        },
        err=>{
          console.error("TobiServices homework read failed:",hwKey,err);
          sharedHomeworkData[hwKey]=[];
          rebuildHomeworkData();
          renderTimetable();
          done();
        }
      );
      homeworkUnsubscribes.push(unsub);

      // Bereits vorhandene Einträge im alten Projekt bleiben sichtbar,
      // sind dort aber schreibgeschützt und nicht über den neuen Reportweg löschbar.
      const oldUnsub=db.collection("homework").doc(hwKey).collection("entries").onSnapshot(
        snap=>{
          olderSharedHomeworkData[hwKey]=[];
          snap.forEach(d=>{
            const data=d.data()||{};
            olderSharedHomeworkData[hwKey].push({
              id:d.id,
              text:typeof data.text==="string"?data.text:"",
              author:typeof data.author==="string"?data.author:"",
              authorUid:"",
              createdAt:data.createdAt||null,
              images:Array.isArray(data.images)?data.images:[],
              legacy:true
            });
          });
          rebuildHomeworkData();
          renderTimetable();
          done();
        },
        err=>{
          console.warn("Older JDNEXT homework read failed:",hwKey,err);
          olderSharedHomeworkData[hwKey]=[];
          rebuildHomeworkData();
          renderTimetable();
          done();
        }
      );
      homeworkUnsubscribes.push(oldUnsub);
    });
  });
}

async function loadLegacyHomework(){
  if(legacyHomeworkUnsubscribe){
    try{legacyHomeworkUnsubscribe();}catch{}
    legacyHomeworkUnsubscribe=null;
  }
  legacyHomeworkUnsubscribe=db.collection("homework").onSnapshot(
    snap=>{
      const visibleKeys=new Set(currentWeekHomeworkKeys());
      const nextLegacy={};
      snap.forEach(d=>{
        if(!visibleKeys.has(d.id)) return;
        const data=d.data()||{};
        const entries=Array.isArray(data.entries)?data.entries:[];
        if(!entries.length) return;
        nextLegacy[d.id]=[];
        entries.forEach((legacyEntry,idx)=>{
          const legacyId=typeof legacyEntry.id==="string" ? legacyEntry.id : "legacy_"+d.id+"_"+(legacyEntry.ts||idx);
          nextLegacy[d.id].push({
            id:legacyId,
            text:typeof legacyEntry.text==="string"?legacyEntry.text:"",
            author:typeof legacyEntry.author==="string"?legacyEntry.author:"",
            authorUid:"",
            createdAt:null,
            images:Array.isArray(legacyEntry.images)?legacyEntry.images:[],
            legacy:true
          });
        });
      });
      legacyHomeworkData=nextLegacy;
      rebuildHomeworkData();
      renderTimetable();
    },
    err=>console.warn("Legacy homework read failed:",err)
  );
}

async function saveHomeworkEntry(hwKey,entry,images=[]){
  setSync("Speichert…");
  try{
    const user=await ensureTobiAuthForJdnext();
    if(!user) throw new Error("JDNEXT konnte keine Verbindung herstellen.");
    let profile=null;
    if(!user.isAnonymous) profile=await ensureTobiProfile(user);

    const entryRef=tobiDb.collection("jdnextHomework").doc(hwKey).collection("entries").doc(entry.id);
    const ownerRef=tobiDb.collection("jdnextHomeworkPrivate").doc(hwKey).collection("entries").doc(entry.id);
    const imageMetadata=(Array.isArray(images)?images.slice(0,3):[]).map(image=>({
      kind:"firestore",
      imageId:String(image.imageId),
      filename:String(image.filename||"bild.jpg").slice(0,120)
    }));
    const eventId="reward-"+hwKey+"-"+entry.id;
    const eventRef=tobiDb.collection("jdnextCoinEvents").doc(eventId);
    const stamp=()=>firebase.firestore.FieldValue.serverTimestamp();
    let rewardApplied=false;

    await tobiDb.runTransaction(async transaction=>{
      const entrySnap=await transaction.get(entryRef);
      // Private metadata and coin-event documents intentionally cannot be read by clients.
      // Their create-only rules reject ID reuse without exposing those documents.
      if(entrySnap.exists) throw new Error("Dieser Hausaufgabeneintrag existiert bereits.");

      let authorTobiUid=null;
      let profileRef=null;
      let profileSnap=null;
      if(!user.isAnonymous && profile?.disabled!==true &&
         (Number.isSafeInteger(profile?.goldCoins)?profile.goldCoins:0)>-50){
        profileRef=tobiDb.collection("users").doc(user.uid);
        profileSnap=await transaction.get(profileRef);
        if(profileSnap.exists &&
           profileSnap.data()?.disabled!==true &&
           (Number.isSafeInteger(profileSnap.data()?.goldCoins)?profileSnap.data().goldCoins:0)>-50){
          authorTobiUid=user.uid;
        }
      }

      if(authorTobiUid){
        const before=Number.isSafeInteger(profileSnap.data()?.goldCoins)?profileSnap.data().goldCoins:0;
        const after=before+10;
        if(!Number.isSafeInteger(after)) throw new Error("Der Münzstand ist außerhalb des erlaubten Zahlenbereichs.");
        transaction.update(profileRef,{
          goldCoins:after,
          lastProfileChangeAt:stamp(),
          lastJdnextCoinEventId:eventId
        });
        transaction.set(eventRef,{
          uid:user.uid, amount:10, type:"homework-post", hwKey, entryId:entry.id,
          createdAt:stamp()
        });
        rewardApplied=true;
      }

      transaction.set(entryRef,{
        text:entry.text,
        author:entry.author,
        images:imageMetadata,
        reportCount:0,
        createdAt:stamp()
      });
      transaction.set(ownerRef,{
        authorAuthUid:user.uid,
        authorTobiUid:authorTobiUid,
        createdAt:stamp()
      });
      (Array.isArray(images)?images.slice(0,3):[]).forEach(image=>{
        if(typeof image.dataUrl!=="string" || image.dataUrl.length>800000){
          throw new Error("Ein Bild überschreitet die erlaubte Uploadgröße.");
        }
        transaction.set(entryRef.collection("images").doc(String(image.imageId)),{
          filename:String(image.filename||"bild.jpg").slice(0,120),
          dataUrl:image.dataUrl,
          createdAt:stamp()
        });
      });
    });

    if(!sharedHomeworkData[hwKey]) sharedHomeworkData[hwKey]=[];
    sharedHomeworkData[hwKey].push({
      ...entry,
      images:imageMetadata,
      authorUid:"",
      reportCount:0,
      createdAt:null,
      legacy:false
    });
    rebuildHomeworkData();
    setSync(rewardApplied
      ? "● Gespeichert · +10 Goldmünzen gutgeschrieben"
      : "● Gespeichert · live für alle sichtbar");
    return {ok:true,rewardQueued:rewardApplied};
  }catch(e){
    console.error("Hausaufgabe konnte nicht gespeichert werden:",e);
    setSync(e?.message||"⚠️ Speichern verweigert – Regeln oder Verbindung prüfen");
    throw e;
  }
}

function renderTimetable(){
  const wt = weekType(selectedMonday);
  const dates = DAY_NAMES.map((_,i)=>addDays(selectedMonday,i));
  const tt = document.getElementById("timetable");
  tt.innerHTML = "";

  tt.appendChild(el("div","cell corner"));
  DAY_NAMES.forEach((dn,i)=>{
    const c = el("div","cell dayhead");
    c.innerHTML = `<div class="dn">${DAY_SHORT[i]}</div><div class="dd">${fmtShort(dates[i])}</div>`;
    tt.appendChild(c);
  });

  CONFIG.periods.forEach((p, pIdx)=>{
    const tc = el("div","cell timecell");
    tc.innerHTML = `${p.label}<small>${p.time}</small>`;
    tt.appendChild(tc);

    DAY_NAMES.forEach((dn,i)=>{
      const subject = ((CONFIG.schedule[wt][dn]||[])[pIdx] || "").trim();
      const isFree = subject==="" || subject==="-";
      const dateKey = isoDate(dates[i]);
      const hwKey = `${dateKey}_${pIdx}`;
      const entries = getHomeworkEntries(hwKey);
      const classworkEntries=getClassworkEntries(hwKey);
      const hasClasswork=classworkEntries.length>0;
      const c = el("div","cell subjcell" + (isFree?" free":"") + (hasClasswork?" classwork":""));
      c.innerHTML = isFree ? "–" : `<div class="sname">${subject}</div>${entries.length?`<div class="hwdot">${entries.length}</div>`:""}`;
      if(!isFree){
        c.addEventListener("click", ()=> openModal(dates[i], pIdx, subject));
      }
      tt.appendChild(c);
    });
  });
}

        row.textContent=item.title||"Klassenarbeit";

      });

        const who=el("div","who");

        name.textContent=e.author||"Anonym";
        const reportBtn=document.createElement("button");
        reportBtn.className="reportbtn";
        reportBtn.type="button";
        if(e.legacy){
          reportBtn.disabled=true;
          reportBtn.textContent="Alte Meldung";
          reportBtn.title="Dieser alte Eintrag ist nur lesbar.";
        }else if(wasReported(e.id)){
          reportBtn.disabled=true;
          reportBtn.textContent="🚩 Gemeldet";
        }else{
          reportBtn.textContent="🚩 Melden";
          reportBtn.onclick=()=>reportEntry(hwKey,e.id,draw);
        }
        who.appendChild(name);
        who.appendChild(reportBtn);
        item.appendChild(who);

        const textNode=document.createElement("div");
        textNode.textContent=e.text;
        item.appendChild(textNode);
        renderDiscordGallery(item,e.images,hwKey,e.id);
        list.appendChild(item);
      });

      const title=input.value.trim();
      if(!title)return;
      classworkSave.disabled=true;
      classworkSave.textContent="…";
      try{
        await saveClassworkEntry(hwKey,title);
        input.value="";
        showToast("✅ Klassenarbeit eingetragen");
        renderTimetable();
      }catch(error){
        console.error(error);
        showToast(error?.message||"Klassenarbeit konnte nicht gespeichert werden.");
      }finally{
        classworkSave.disabled=false;
        classworkSave.textContent="KA+";
      }
    };

    const imageInput=modal.querySelector(".hwimages");
    const imageList=modal.querySelector(".image-list");
    imageInput.onchange=()=>{
      imageList.innerHTML="";
      [...imageInput.files].slice(0,3).forEach(file=>{
        const chip=el("span","image-chip");
        chip.textContent=file.name;
        imageList.appendChild(chip);
      });
      if(imageInput.files.length>3){
        const chip=el("span","image-chip");
        chip.textContent="Nur die ersten 3 Bilder werden verwendet.";
        imageList.appendChild(chip);
      }

    const saveBtn=modal.querySelector(".hwsave");

    saveBtn.onclick=async()=>{
      const textEl=modal.querySelector(".hwtext");
      const authorEl=modal.querySelector(".hwauthor");
      const errEl=modal.querySelector("#hwerror");
      const text=textEl.value.trim();
      const author=authorEl.value.trim();
      errEl.textContent="";
      if(text.length<3){
        errEl.textContent="Bitte mindestens 3 Zeichen als Hausaufgabe eintragen.";
        return;
      }
      if(text.length>1000){
        errEl.textContent="Die Hausaufgabe ist zu lang (max. 1000 Zeichen).";
        return;
      }
      if(author.length>80){
        errEl.textContent="Der Name ist zu lang (max. 80 Zeichen).";
        return;
      }
      if(isNonsense(text)){
        errEl.textContent="Das sieht nach Unsinn/Spam aus — bitte eine echte Hausaufgabe eintragen.";
        return;
      }

      saveBtn.disabled=true;
      saveBtn.textContent="Speichert…";
      try{

        for(let index=0;index<files.length;index++){

          imageRefs.push({
            kind:"firestore",
            imageId:`img${index}`,
            filename:String(files[index].name||`bild-${index+1}.jpg`).slice(0,120),
            dataUrl
          });

        saveBtn.textContent="Speichert…";
        const ok=await saveHomeworkEntry(hwKey,{id:genId(),text,author},imageRefs);
        saveBtn.disabled=false;
        saveBtn.textContent="Speichern";
        if(ok){ 
          draw();
          renderTimetable();
          showToast(ok.rewardQueued ? "✅ Hausaufgabe gespeichert · +10 Goldmünzen" : "✅ Hausaufgabe gespeichert");
        }
      }catch(error){
        console.error(error);
        errEl.textContent=error?.message||"Bild oder Hausaufgabe konnte nicht gespeichert werden.";
        saveBtn.disabled=false;
        saveBtn.textContent="Speichern";
      }
    };
  }

  draw();
  overlay.classList.add("show");
}

function genId(){
  if(window.crypto && typeof crypto.randomUUID==="function") return crypto.randomUUID();
  return Date.now().toString(36)+Math.random().toString(36).slice(2,10);
}

async function compressImageFile(file){
  if(!file.type.startsWith("image/")) throw new Error("Bitte nur Bilder auswählen.");
  if(file.size>20*1024*1024) throw new Error("Das Originalbild darf höchstens 20 MB groß sein.");

  const bitmap=await createImageBitmap(file);
  try{
    // Firestore permits up to 1 MiB per document. Keep the encoded data URL
    // well below that limit so image uploads work on Firebase Spark.
    const maxBlobBytes=560*1024;
    const maxSides=[960,800,640,512,384];
    const qualities=[0.82,0.72,0.62,0.52,0.42,0.32];
    const canvas=document.createElement("canvas");
    const ctx=canvas.getContext("2d",{alpha:false});
    if(!ctx) throw new Error("Canvas konnte nicht initialisiert werden.");

    for(const maxSide of maxSides){
      const scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
      canvas.width=Math.max(1,Math.round(bitmap.width*scale));
      canvas.height=Math.max(1,Math.round(bitmap.height*scale));
      ctx.fillStyle="#ffffff";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
      for(const quality of qualities){
        const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",quality));
        if(!blob) continue;
        if(blob.size<=maxBlobBytes){
          const bytes=new Uint8Array(await blob.arrayBuffer());
          let binary="";
          const chunk=0x8000;
          for(let i=0;i<bytes.length;i+=chunk){
            binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
          }
          const dataUrl="data:image/jpeg;base64,"+btoa(binary);
          if(dataUrl.length<=800000) return dataUrl;
        }
      }
    }
    throw new Error("Das Bild ist selbst nach starker Komprimierung zu groß. Bitte ein kleineres Bild auswählen.");
  }finally{
    bitmap.close();
  }
}

function wasReported(id){

}

async function removeReportedHomework(hwKey,id){
  const entryRef=tobiDb.collection("jdnextHomework").doc(hwKey).collection("entries").doc(id);
  const ownerRef=tobiDb.collection("jdnextHomeworkPrivate").doc(hwKey).collection("entries").doc(id);
  const entrySnap=await entryRef.get();
  if(!entrySnap.exists || Number(entrySnap.data()?.reportCount||0)<2) return false;
  const ownerSnap=await ownerRef.get();
  if(!ownerSnap.exists) throw new Error("Private Autorzuordnung fehlt; Eintrag bleibt bestehen.");

  const owner=ownerSnap.data()||{};
  const authorUid=typeof owner.authorTobiUid==="string" ? owner.authorTobiUid : "";
  const batch=tobiDb.batch();
  if(authorUid){
    const profileRef=tobiDb.collection("users").doc(authorUid);
    const eventId="penalty-"+hwKey+"-"+id;
    const eventRef=tobiDb.collection("jdnextCoinEvents").doc(eventId);
    const makeRemovalBatch=tryDisable=>{
      const removalBatch=tobiDb.batch();
      removalBatch.set(eventRef,{
        uid:authorUid, amount:-20, type:"homework-removal", hwKey, entryId:id,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      removalBatch.update(profileRef,{
        goldCoins:firebase.firestore.FieldValue.increment(-20),
        lastProfileChangeAt:firebase.firestore.FieldValue.serverTimestamp(),
        lastJdnextCoinEventId:eventId,
        ...(tryDisable?{disabled:true}:{})
      });
      removalBatch.delete(entryRef);
      removalBatch.delete(ownerRef);
      (Array.isArray(entrySnap.data()?.images)?entrySnap.data().images:[]).forEach(image=>{
        if(image?.kind==="firestore" && typeof image.imageId==="string"){
          removalBatch.delete(entryRef.collection("images").doc(image.imageId));
        }
      });
      return removalBatch;
    };
    // The reporter cannot read another user's profile. We try an atomic batch
    // that sets disabled=true; rules accept it only if the new balance is <= -50
    // (or the account was already disabled). If it is too early, retry without
    // that flag; the rules only allow this second batch when the threshold isn't hit.
    try{
      await makeRemovalBatch(true).commit();
      return true;
    }catch(firstError){
      await makeRemovalBatch(false).commit();
      return true;
    }
  }
  batch.delete(entryRef);
  batch.delete(ownerRef);
  (Array.isArray(entrySnap.data()?.images)?entrySnap.data().images:[]).forEach(image=>{
    if(image?.kind==="firestore" && typeof image.imageId==="string"){
      batch.delete(entryRef.collection("images").doc(image.imageId));
    }
  });
  await batch.commit();
  return true;
}

async function reportEntry(hwKey,id,redraw){
  if(wasReported(id)) return;
  const user=await ensureTobiAuthForJdnext();
  if(!user){
    showToast("⚠️ Meldungen sind momentan nicht verfügbar");
    return;
  }
  const entry=getHomeworkEntries(hwKey).find(e=>e.id===id);
  if(!entry || entry.legacy) return;
  const entryRef=tobiDb.collection("jdnextHomework").doc(hwKey).collection("entries").doc(id);
  const reportRef=entryRef.collection("reports").doc(user.uid);
  try{
    const nextCount=await tobiDb.runTransaction(async transaction=>{
      const entrySnap=await transaction.get(entryRef);
      const reportSnap=await transaction.get(reportRef);
      if(!entrySnap.exists) throw new Error("Der Eintrag wurde bereits entfernt.");
      if(reportSnap.exists) throw new Error("already-reported");
      const current=Number.isSafeInteger(entrySnap.data()?.reportCount)?entrySnap.data().reportCount:0;
      transaction.set(reportRef,{createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      transaction.update(entryRef,{reportCount:current+1});
      return current+1;
    });
    markReported(id);
    if(nextCount>=2){
      try{
        const removed=await removeReportedHomework(hwKey,id);
        showToast(removed?"🚩 Zwei Meldungen: Eintrag entfernt":"🚩 Meldung gespeichert");
      }catch(removalError){
        console.error("Moderation failed:",removalError);
        showToast("🚩 Meldung gespeichert; Entfernung konnte nicht abgeschlossen werden");
      }
    }else{
      showToast("🚩 Meldung gespeichert");
    }
    redraw();
  }catch(e){
    const msg=String(e&&e.message||"").toLowerCase();
    if(msg.includes("already-reported") || e?.code==="already-exists" || e?.code===6){
      markReported(id);
      showToast("🚩 Diesen Eintrag hast du bereits gemeldet");
      redraw();
      return;
    }
    console.error("Firestore-Meldung fehlgeschlagen:",e);
    showToast("⚠️ Meldung konnte nicht gespeichert werden");
  }
}

}
function applyTheme(themeId){

  const root=document.documentElement;
  root.dataset.jdnextTheme=theme.id.toLowerCase();
  root.style.setProperty("--bg-a",theme.bgA);
  root.style.setProperty("--bg-b",theme.bgB);
  root.style.setProperty("--bg-c",theme.bgC);
  root.style.setProperty("--pink",theme.pink);
  root.style.setProperty("--cyan",theme.cyan);
  root.style.setProperty("--gold",theme.gold);
  root.style.setProperty("--violet",theme.violet);
}
function getOwnedThemeIds(profile=activeTobiProfile){

}

async function purchaseTheme(theme){
  if(theme.price!==10 || theme.id==="Next"){
    showToast("Dieses Theme ist kostenlos oder nicht käuflich.");
    return;
  }
  if(!activeTobiUser || !activeTobiProfile){
    showToast("Melde dich mit TobiServices an, um Themes zu kaufen.");
    return;
  }
  if(activeTobiProfile.disabled===true){
    showToast("Dein TobiServices-Konto ist gesperrt.");
    return;
  }
  try{
    const profileRef=tobiDb.collection("users").doc(activeTobiUser.uid);
    const eventId="theme-"+activeTobiUser.uid+"-"+theme.id;
    const eventRef=tobiDb.collection("jdnextCoinEvents").doc(eventId);
    const stamp=()=>firebase.firestore.FieldValue.serverTimestamp();
    const result=await tobiDb.runTransaction(async transaction=>{
      const profileSnap=await transaction.get(profileRef);
      if(!profileSnap.exists) throw new Error("Dein TobiServices-Profil wurde nicht gefunden.");
      const profile=profileSnap.data()||{};
      if(profile.disabled===true) throw new Error("Dein TobiServices-Konto ist gesperrt.");
      const coins=Number.isSafeInteger(profile.goldCoins)?profile.goldCoins:0;
      const owned=Array.isArray(profile.ownedThemes)?profile.ownedThemes:[];
      if(owned.includes(theme.id)) return {alreadyOwned:true,coins,owned};
      if(coins<10) throw new Error("Du brauchst mindestens 10 Goldmünzen für dieses Theme.");
      const nextOwned=[...owned,theme.id];
      transaction.update(profileRef,{
        goldCoins:coins-10,
        ownedThemes:nextOwned,
        lastProfileChangeAt:stamp(),
        lastJdnextCoinEventId:eventId
      });
      transaction.set(eventRef,{
        uid:activeTobiUser.uid,
        amount:-10,
        type:"theme-purchase",
        themeId:theme.id,
        createdAt:stamp()
      });
      return {alreadyOwned:false,coins:coins-10,owned:nextOwned};
    });
    activeTobiProfile={...activeTobiProfile,goldCoins:result.coins,ownedThemes:result.owned};
    updateTobiLoginButton();
    showToast(result.alreadyOwned?"Dieses Theme gehört dir bereits.":"🎨 "+theme.name+" gekauft · −10 Goldmünzen");
    renderThemeMenu();
  }catch(error){
    console.error("Theme purchase failed:",error);
    showToast(error?.message||"Der Kauf ist fehlgeschlagen. Prüfe die TobiServices-Firestore-Regeln.");
  }
}

document.getElementById("themeBtn").onclick=openThemeMenu;

// ---- PWA / App-Installation ----
let deferredInstallPrompt = null;

window.addEventListener("beforeinstallprompt", event=>{
  event.preventDefault();
  deferredInstallPrompt = event;
  const btn = document.getElementById("installBtn");
  if(btn) btn.style.display = "inline-block";
});

window.addEventListener("appinstalled", ()=>{
  deferredInstallPrompt = null;
  const btn = document.getElementById("installBtn");
  if(btn) btn.style.display = "none";
  showToast("✅ Stundenplan wurde installiert");
});

document.getElementById("installBtn").onclick = async ()=>{
  if(!deferredInstallPrompt){
    showToast("📱 Browsermenü → „App installieren“");
    return;
  }
  deferredInstallPrompt.prompt();
  try { await deferredInstallPrompt.userChoice; }
  catch(e) { console.warn("Installation:", e); }
  deferredInstallPrompt = null;
  document.getElementById("installBtn").style.display = "none";
};

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js", {scope:"./"})
      .then(()=>console.log("PWA Service Worker aktiv"))
      .catch(err=>console.warn("Service Worker:", err));
  });
}
