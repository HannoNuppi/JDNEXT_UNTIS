plugins {
    id "com.android.application"
}

android {
    namespace "de.tobiservices.untisnext"
    compileSdk 35

    defaultConfig {
        applicationId "de.tobiservices.untisnext"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
